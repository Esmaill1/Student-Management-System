<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Attendance System</title>
    <!-- CSS -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    

    <!-- Main Content -->
    <div class="container main-content">
        
            
                
                    
                
            
        

        
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1 class="login-title">Student Attendance System</h1>
            <p class="login-subtitle">Sign in to manage attendance records</p>
        </div>
        <div class="login-body">
            
                
                    
                        
                    
                
            

            <div class="form-removed">
                
                <div class="form-group">
                    <label class="form-label">Username</label>
                    
                    
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    
                    
                </div>
                <div class="form-group">
                    <label>
                         Remember me
                    </label>
                </div>
                <div class="form-group mt-4">
                    
                </div>
            </div>
        </div>
        
    </div>
</div>

    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Student Attendance System. All rights reserved.</p>
        </div>
    </footer>

    <!-- JS (Optional) -->
    <script>
        // Close alerts automatically after 5 seconds
        document.addEventListener('DOMContentLoaded', function() {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                setTimeout(function() {
                    alert.style.opacity = '0';
                    setTimeout(function() {
                        alert.remove();
                    }, 500);
                }, 5000);
            });
        });
    </script>
    
</body>
</html>
